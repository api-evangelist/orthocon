name: Orthocon
description: 'Orthocon, now operating as Abyrx, is a surgical-therapeutics medical
  device company that has built a materials-science platform focused on therapeutic
  devices used during surgical procedures. Its portfolio centers on resorbable and
  hemostatic bone putties for orthopedic, trauma, spine, sports medicine, cranial,
  maxillofacial, and cardiothoracic applications, including AHBP (water-soluble hemostatic
  bone putty), the HemaSorb family (HemaSorb, HemaSorb Apply, HemaSorb Plus with HA/beta-TCP),
  and MONTAGE settable resorbable bone putty. The company sells directly to surgeons,
  hospitals, and distributors and does not operate a public API, developer portal,
  SDKs, or programmatic developer surface. This profile was surfaced as a portfolio
  company of Canaan Partners and enriched via the API Evangelist pipeline; the honest
  result is that there is no API surface to catalog.'
